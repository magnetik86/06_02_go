name: Go CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build -o dummy-server.bin

      - name: Test
        run: |
          ./dummy-server.bin &
          sleep 5
          curl http://localhost:8080
          kill $!

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dummy-server-binary
          path: dummy-server.bin
