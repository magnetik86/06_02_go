cat <<EOF > .github/workflows/ci.yml
name: Go CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        # Собираем бинарник из папки cmd
        run: go build -o dummy-server.bin ./cmd

      - name: Test
        # Запускаем сервер в фоне, ждем и проверяем через curl
        run: |
          ./dummy-server.bin &
          sleep 5
          curl http://localhost:8080
          kill \$!

      - name: Upload Artifact
        # Сохраняем результат сборки как артефакт GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dummy-server-binary
          path: dummy-server.bin
EOF
